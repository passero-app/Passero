[package]
name = "passero-core"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
sequoia-openpgp = { version = "2.3", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }
thiserror = "2"

[target.'cfg(target_os = "ios")'.dependencies]
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "https"] }

[dev-dependencies]
tempfile = "3"
